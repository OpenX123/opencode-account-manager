services:
  account-manager:
    build:
      context: .
      args:
        VITE_BASE_PATH: /
    container_name: opencode-account-manager
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:3012:3001
      - 127.0.0.1:3013:6080
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
