server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 154.64.254.52;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://154.64.254.52:8090$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    include /usr/local/openresty/nginx/conf/ssl/root_ssl.conf;
    ssl_reject_handshake on;
}

server {
    listen 8090 ssl default_server;
    listen [::]:8090 ssl default_server;
    server_name 154.64.254.52;
    http2 on;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/ocam-ip/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/ocam-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OCAMSSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /_ocam_browser_auth {
        internal;
        proxy_pass http://127.0.0.1:3012/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location ^~ /browser-view/ {
        auth_request /_ocam_browser_auth;
        proxy_pass http://127.0.0.1:3013/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        client_max_body_size 2m;
    }
}
